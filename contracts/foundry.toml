[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

fs_permissions = [{ access = "read-write", path = "deployments" }]

# Base-only MVP: Base Sepolia (staging) and local Anvil. No mainnet target.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[profile.default.fuzz]
runs = 256
# Pinned seed: fuzz/invariant runs are deterministic so a latent counterexample
# (e.g. the RedemptionQueue dust underflow) can't pass by seed luck on one run
# and fail on the next. Reproducible locally and in CI.
seed = "0x4e455854424c4f434b"

[profile.ci.fuzz]
runs = 1000
seed = "0x4e455854424c4f434b"

[profile.ci.invariant]
runs = 256
depth = 100
fail_on_revert = false

# Exploratory nightly profile. Long sequences find the states a hundred-step
# run never reaches: the agent suite's first finding needed a deposit, an
# allocation and a redemption in that order, and depth is what makes such
# orderings likely rather than lucky.
[profile.deep.invariant]
runs = 5000
depth = 500
fail_on_revert = false
shrink_run_limit = 5000

[profile.deep.fuzz]
runs = 5000
seed = "0x4e455854424c4f434b"

# Negative-perimeter profile: every revert is a failure. This is what exposes a
# misconfigured handler — a sequence that ought to be valid but reverts means
# the harness is burning its budget on rejected calls and proving nothing. Run
# it against suites whose handlers are written to stay inside the rules.
[profile.strict.invariant]
runs = 512
depth = 50
fail_on_revert = true

[profile.strict.fuzz]
runs = 256
seed = "0x4e455854424c4f434b"
